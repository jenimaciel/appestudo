<!doctype html>
<html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>TJRS Estudos</title><style>
:root{--bg:#f6f3ef;--card:#fffdf9;--text:#3f3a35;--muted:#827970;--line:#e6ded5;--accent:#8c7866;--soft:#eee7df;--ok:#78907c;--warn:#b89563}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font:14px system-ui,-apple-system,Segoe UI,sans-serif}button,input,textarea,select{font:inherit}.app{max-width:1100px;margin:auto;padding:22px}.nav{display:flex;gap:7px;flex-wrap:wrap;margin-bottom:22px}.nav button,.btn{border:1px solid var(--line);background:var(--card);color:var(--text);padding:9px 12px;border-radius:9px;cursor:pointer}.nav button.active,.btn.primary{background:var(--accent);color:white;border-color:var(--accent)}h1{font-size:26px;margin:0 0 4px}h2{font-size:18px;margin:0 0 12px}.sub,.muted{color:var(--muted)}.grid{display:grid;grid-template-columns:1.4fr .8fr;gap:16px}.card{background:var(--card);border:1px solid var(--line);border-radius:15px;padding:20px;box-shadow:0 4px 18px #5d4b3d0b}.hero{padding:25px}.tag{display:inline-block;background:var(--soft);padding:5px 8px;border-radius:99px;font-size:11px}.block{border:1px solid var(--line);border-radius:12px;padding:15px;margin-top:10px;background:#fff}.block.active{border-color:var(--accent);box-shadow:0 0 0 2px #8c786618}.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}.timer{font-size:32px;font-weight:700;margin:12px 0}.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:9px}.stat{background:var(--soft);border-radius:10px;padding:12px}.stat b{display:block;font-size:20px}.input,textarea,select{border:1px solid var(--line);border-radius:9px;padding:10px;background:white;color:var(--text);width:100%}textarea{min-height:90px;resize:vertical}.table{width:100%;border-collapse:collapse}.table th,.table td{padding:10px;border-bottom:1px solid var(--line);text-align:left;font-size:12px}.bar{height:8px;background:var(--soft);border-radius:99px;overflow:hidden}.bar i{display:block;height:100%;background:var(--accent)}.empty{padding:25px;text-align:center;color:var(--muted)}.notice{background:#f1ebe4;border-left:3px solid var(--accent);padding:12px;border-radius:8px;margin-top:12px;font-size:12px}.actions{display:flex;gap:8px;flex-wrap:wrap;margin-top:10px}@media(max-width:750px){.grid{grid-template-columns:1fr}.stats{grid-template-columns:1fr 1fr}.app{padding:14px}}
</style></head><body><main class="app"><nav class="nav" id="nav"></nav><div id="view"></div></main><script>
const KEY='tjrs-estudos-v1',today=()=>new Date().toISOString().slice(0,10),D=(s)=>new Date(s+'T00:00:00').toLocaleDateString('pt-BR');
let S=JSON.parse(localStorage.getItem(KEY)||'null')||{plan:[],q:[],reviews:[],simulados:[],time:{},errors:{},edital:''};function save(){localStorage.setItem(KEY,JSON.stringify(S))}function esc(x){return String(x||'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
function seed(){if(S.plan.length)return;let d=new Date();for(let i=0;i<30;i++){let x=new Date(d);x.setDate(d.getDate()+i);S.plan.push({date:x.toISOString().slice(0,10),discipline:['Português','Direito Constitucional','Direito Administrativo','TI'][i%4],subject:['Interpretação de texto','Direitos fundamentais','Atos administrativos','Tecnologia da Informação'][i%4],blocks:['Aprender o assunto','Praticar questões','Corrigir erros e registrar acertos']})}save()}seed();
function nav(p){document.querySelectorAll('#nav button').forEach(x=>x.classList.toggle('active',x.dataset.p===p));({today:todayPage,questions:questionsPage,reviews:reviewsPage,simulados:simuladosPage,progress:progressPage,ai:aiPage,plan:planPage}[p]())}
document.getElementById('nav').innerHTML=['today|Hoje','plan|Cronograma','questions|Questões','reviews|Revisões','simulados|Simulados','progress|Progresso','ai|✨ IA'].map(x=>{let[a,b]=x.split('|');return `<button data-p="${a}" onclick="nav('${a}')">${b}</button>`}).join('');
let timer=null,tk='';function fmt(sec){let m=Math.floor(sec/60),s=sec%60;return String(m).padStart(2,'0')+':'+String(s).padStart(2,'0')}function elapsed(k){return S.time[k]||0}
function start(k){if(timer)return;tk=k;let st=Date.now();timer=setInterval(()=>{document.getElementById('timer').textContent=fmt(elapsed(k)+Math.floor((Date.now()-st)/1000))},500);window._stop=()=>{S.time[k]=(S.time[k]||0)+Math.floor((Date.now()-st)/1000);clearInterval(timer);timer=null;save();todayPage()}}
function todayPage(){let day=S.plan.find(x=>x.date===today())||S.plan[0],i=0,k=day.date+'-'+i;document.getElementById('view').innerHTML=`<section class="card hero"><span class="tag">HOJE</span><h1>${esc(day.subject)}</h1><p class="sub">${esc(day.discipline)} · uma coisa de cada vez.</p><div class="block"><b>Bloco 1 · Aprender</b><p>${esc(day.blocks[0])}</p></div><div class="block"><b>Bloco 2 · Praticar</b><p>${esc(day.blocks[1])}</p></div><div class="block active"><b>Bloco 3 · Questões + erros</b><p>Faça as questões e registre tudo aqui. O resultado ficará ligado a este assunto.</p><div class="stats"><div class="stat"><b>${dayQ(day).total}</b>questões</div><div class="stat"><b>${dayQ(day).hits}</b>acertos</div><div class="stat"><b>${dayQ(day).pct}%</b>desempenho</div></div><div class="actions"><input class="input" id="qt" type="number" min="1" placeholder="Total de questões"><input class="input" id="qh" type="number" min="0" placeholder="Acertos"></div><textarea id="qe" placeholder="Erros e o que preciso revisar..."></textarea><textarea id="qc" placeholder="O que acertei / o que aprendi..."></textarea><div class="actions"><button class="btn primary" onclick="saveBlockQ('${k}','${esc(day.discipline)}','${esc(day.subject)}')">Salvar questões</button></div></div><div class="row" style="margin-top:16px"><button class="btn primary" onclick="start('${k}')">Começar tempo</button><button class="btn" onclick="window._stop&&window._stop()">Parar e salvar tempo</button><strong id="timer">${fmt(elapsed(k))}</strong></div><div class="notice">Você não precisa compensar um dia perdido. O app mostra o próximo bloco útil.</div></section>`}
function dayQ(day){let a=S.q.filter(x=>x.date===day.date&&x.subject===day.subject),t=a.reduce((n,x)=>n+x.total,0),h=a.reduce((n,x)=>n+x.hits,0);return{total:t,hits:h,pct:t?Math.round(h/t*100):0}}
function saveBlockQ(k,disc,sub){let t=+qt.value,h=+qh.value;if(!t||h<0||h>t)return alert('Confira total e acertos.');S.q.push({date:today(),disc,subject:sub,total:t,hits:h,errors:qe.value,correct:qc.value,block:k});S.errors[k]=qe.value;save();todayPage()}
function questionsPage(){let t=S.q.reduce((a,x)=>a+x.total,0),h=S.q.reduce((a,x)=>a+x.hits,0),p=t?Math.round(h/t*100):0;document.getElementById('view').innerHTML=`<section class="card"><h1>Questões</h1><p class="sub">Tudo salvo no Bloco 3 aparece aqui.</p><div class="stats"><div class="stat"><b>${t}</b>questões</div><div class="stat"><b>${h}</b>acertos</div><div class="stat"><b>${p}%</b>geral</div></div></section><section class="card" style="margin-top:16px"><table class="table"><thead><tr><th>Data</th><th>Disciplina</th><th>Assunto</th><th>Questões</th><th>Acertos</th><th>%</th><th>Erros</th></tr></thead><tbody>${S.q.slice().reverse().map(x=>`<tr><td>${D(x.date)}</td><td>${esc(x.disc)}</td><td>${esc(x.subject)}</td><td>${x.total}</td><td>${x.hits}</td><td>${Math.round(x.hits/x.total*100)}%</td><td>${esc(x.errors||'—')}</td></tr>`).join('')||'<tr><td colspan="7" class="empty">Nenhuma questão registrada.</td></tr>'}</tbody></table></section>`}
function planPage(){document.getElementById('view').innerHTML=`<section class="card"><h1>Cronograma</h1><p class="sub">${S.plan.length} dias cadastrados.</p><table class="table"><thead><tr><th>Data</th><th>Disciplina</th><th>Assunto</th><th>Bloco 1</th><th>Bloco 3</th></tr></thead><tbody>${S.plan.map(x=>`<tr><td>${D(x.date)}</td><td>${esc(x.discipline)}</td><td>${esc(x.subject)}</td><td>${esc(x.blocks[0])}</td><td>${esc(x.blocks[2])}</td></tr>`).join('')}</tbody></table></section>`}
function reviewsPage(){let a=S.q.filter(x=>x.date<today());document.getElementById('view').innerHTML=`<section class="card"><h1>Revisões</h1><p class="sub">A revisão nasce do que você estudou e errou.</p>${a.length?a.slice(-10).reverse().map(x=>`<div class="block"><b>${esc(x.subject)}</b><p>${esc(x.errors||'Revisar o conteúdo estudado.')}</p><button class="btn" onclick="this.textContent='✓ Revisado'">Concluir revisão</button></div>`).join(''):'<div class="empty">As revisões aparecerão depois dos primeiros registros.</div>'}</section>`}
function simuladosPage(){document.getElementById('view').innerHTML=`<section class="card"><h1>Simulados</h1><div class="actions"><input class="input" id="sn" placeholder="Nome do simulado"><input class="input" id="st" type="number" placeholder="Questões"><input class="input" id="sh" type="number" placeholder="Acertos"><button class="btn primary" onclick="addSim()">Salvar</button></div></section><section class="card" style="margin-top:16px"><table class="table"><thead><tr><th>Data</th><th>Nome</th><th>Questões</th><th>Acertos</th><th>%</th></tr></thead><tbody>${S.simulados.map(x=>`<tr><td>${D(x.date)}</td><td>${esc(x.name)}</td><td>${x.total}</td><td>${x.hits}</td><td>${Math.round(x.hits/x.total*100)}%</td></tr>`).join('')||'<tr><td colspan="5" class="empty">Nenhum simulado.</td></tr>'}</tbody></table></section>`}function addSim(){let t=+st.value,h=+sh.value;if(!t||h>t)return alert('Confira os dados.');S.simulados.push({date:today(),name:sn.value||'Simulado',total:t,hits:h});save();simuladosPage()}
function progressPage(){let by={};S.q.forEach(x=>{by[x.disc]??={t:0,h:0};by[x.disc].t+=x.total;by[x.disc].h+=x.hits});document.getElementById('view').innerHTML=`<section class="card"><h1>Progresso</h1>${Object.entries(by).map(([d,x])=>{let p=Math.round(x.h/x.t*100);return `<div class="block"><b>${esc(d)}</b><p>${x.h} de ${x.t} · ${p}%</p><div class="bar"><i style="width:${p}%"></i></div></div>`}).join('')||'<div class="empty">Registre questões para ver sua evolução.</div>'}</section>`}
function aiPage(){let by={};S.q.forEach(x=>{by[x.subject]??={t:0,h:0,err:[]};by[x.subject].t+=x.total;by[x.subject].h+=x.hits;if(x.errors)by[x.subject].err.push(x.errors)});let rank=Object.entries(by).map(([s,x])=>({s,p:Math.round(x.h/x.t*100),e:x.err.join(' ')})).sort((a,b)=>a.p-b.p);document.getElementById('view').innerHTML=`<section class="card hero"><span class="tag">✨ IA LOCAL</span><h1>Meu estudo</h1><p class="sub">Análise baseada nos seus registros. Quando conectarmos uma API, esta tela poderá interpretar o edital e explicar os padrões dos seus erros.</p><div class="actions"><button class="btn primary" onclick="analyze()">Analisar agora</button></div></section>${rank.length?`<section class="card" style="margin-top:16px"><h2>Prioridades</h2>${rank.slice(0,4).map(x=>`<div class="block"><b>${esc(x.s)}</b><p>${x.p}% de acertos</p>${x.e?`<div class="notice">Erros registrados: ${esc(x.e)}</div>`:''}</div>`).join('')}</section>`:''}<section class="card" style="margin-top:16px"><h2>📄 Edital</h2><textarea id="ed" placeholder="Cole o conteúdo do edital aqui...">${esc(S.edital)}</textarea><div class="actions"><button class="btn" onclick="S.edital=ed.value;save();alert('Edital salvo neste navegador.')">Salvar edital</button></div></section>`}
function analyze(){let a=S.q.reduce((n,x)=>n+x.total,0),h=S.q.reduce((n,x)=>n+x.hits,0);alert(a?`Você registrou ${a} questões e está com ${Math.round(h/a*100)}% de acertos. Veja Progresso para identificar as matérias mais fracas.`:'Ainda não há questões suficientes para uma análise. Faça o Bloco 3 primeiro.');}
nav('today');
</script></body></html>
